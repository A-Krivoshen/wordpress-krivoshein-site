    :root {
      --bg:#f7f9fc; --ink:#172133; --mute:#52627d; --line:#d8e0ee;
      --accent:#315fe8; --accent-dark:#244ac2; --card:#fff;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100dvh; display:flex; flex-direction:column;
      font-family:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
      background:

      color:var(--ink); line-height:1.55;
      -webkit-font-smoothing:antialiased;
    }
    main {
      flex:1; display:flex; align-items:center; justify-content:center;
      padding:2rem 1.25rem 3rem;
    }
    .card {
      width:min(32rem, 100%);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:20px;
      padding:clamp(1.5rem, 4vw, 2.25rem);
      box-shadow:0 14px 40px rgba(20,28,43,.08);
    }
    .code {
      display:inline-flex; align-items:center; gap:.4rem;
      font-weight:700; font-size:.8rem; letter-spacing:.04em;
      color:var(--accent); background:rgba(49,95,232,.08);
      border:1px solid rgba(49,95,232,.16);
      border-radius:999px; padding:.35rem .75rem; margin-bottom:1rem;
    }
    h1 {
      margin:0 0 .75rem; font-size:clamp(1.6rem, 1.2rem + 1.5vw, 2.1rem);
      letter-spacing:-.03em; line-height:1.15; text-wrap:balance;
    }
    p { margin:0 0 1.25rem; color:var(--mute); max-width:36ch; }
    .actions { display:flex; flex-wrap:wrap; gap:.65rem; }
    a.btn {
      display:inline-flex; align-items:center; justify-content:center;
      min-height:2.75rem; padding:.65rem 1.15rem; border-radius:12px;
      font-weight:600; text-decoration:none; font-size:.95rem;
      transition:transform .2s ease, background .2s ease, box-shadow .2s ease;
    }
    a.btn:active { transform:translateY(1px) scale(.98); }
    a.btn-primary {
      background:var(--accent); color:#fff;
      box-shadow:0 14px 32px rgba(49,95,232,.28);
    }
    a.btn-primary:hover { background:var(--accent-dark); }
    a.btn-ghost {
      background:#fff; color:var(--ink); border:1px solid var(--line);
    }
    a.btn-ghost:hover { border-color:rgba(49,95,232,.35); color:var(--accent-dark); }
    a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    footer {
      text-align:center; padding:1rem 1.25rem 1.5rem; color:var(--mute); font-size:.85rem;
    }
    footer a { color:var(--accent); text-decoration:none; font-weight:600; }
